[project]
name = "finans-agent"
version = "0.1.0"
description = "SGR Multi-Agent Financial Trading System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core SGR Trading System
    "openai>=1.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    
    # Financial Data & APIs
    "yfinance>=0.2.0",
    "requests>=2.31.0",
    
    # Data Processing & Analysis
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    
    # Visualization & Reporting
    "tabulate>=0.9.0",
]
